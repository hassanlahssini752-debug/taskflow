<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a14"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TaskFlow"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>TaskFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0a0a14}
body{font-family:'Syne',sans-serif;overscroll-behavior:none;color:#e2e2f0}
#root{height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
button{font-family:'Syne',sans-serif;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:'Syne',sans-serif;outline:none;border:none;background:none;color:#e2e2f0}
textarea{resize:none}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideLeft{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes popIn{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 var(--rc,.3)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes progressFill{from{width:0}to{width:var(--w)}}

.su{animation:slideUp .3s cubic-bezier(.34,1.56,.64,1) both}
.sl{animation:slideLeft .25s ease both}
.pop{animation:popIn .28s cubic-bezier(.34,1.56,.64,1) both}
.rdot{animation:pulse 1.1s ease infinite;display:inline-block;border-radius:50%}
.ring{animation:ringPulse 1.8s ease infinite}
.glass{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.glass2{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

/* ══════════════════════════════════════════
   CONSTANTS
══════════════════════════════════════════ */
const MOODS=[
  {id:1,e:"😴",l:"Épuisé",c:"#64748b"},{id:2,e:"😔",l:"Faible",c:"#f87171"},
  {id:3,e:"😐",l:"Neutre",c:"#fbbf24"},{id:4,e:"🙂",l:"Bien",c:"#34d399"},
  {id:5,e:"⚡",l:"Max",c:"#a78bfa"},
];
const PROJ_COLORS=["#63dcb4","#f472b6","#60a5fa","#fbbf24","#a78bfa","#fb923c","#34d399","#f87171","#38bdf8","#e879f9"];
const PROJ_ICONS=["🚀","💼","🎨","📚","💪","🏠","🎯","⚡","🌟","🔬","🎵","💡","🌍","🔧","📱"];
const CATS=["À faire","En cours","En révision","Terminée"];

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
const pad=n=>String(n).padStart(2,"0");
const fmtTime=ms=>{const s=Math.floor(ms/1000);return`${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`};
const fmtMin=ms=>{const m=Math.round(ms/60000);return m<60?m+"min":Math.floor(m/60)+"h"+(m%60?""+m%60:"")};
const todayKey=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

/* ══════════════════════════════════════════
   STORAGE API
══════════════════════════════════════════ */
// Projects: {id, name, color, icon, desc, createdAt, archived}
const loadProjects=()=>load("tf3_projects",[]);
const saveProjects=p=>save("tf3_projects",p);

// Tasks per project: tf3_tasks_{projectId} → [{id,title,note,status,priority,elapsed,running,reminder,createdAt,doneAt,color}]
const loadTasks=pid=>load("tf3_tasks_"+pid,[]);
const saveTasks=(pid,tasks)=>save("tf3_tasks_"+pid,tasks);

// Daily log: tf3_day_{date} → {mood, totalElapsed, activePid}
const loadDay=d=>load("tf3_day_"+d,{mood:0,totalElapsed:0});
const saveDay=(d,data)=>save("tf3_day_"+d,data);

// Global history for streaks
const getStreak=()=>{
  let streak=0,cur=new Date();cur.setHours(0,0,0,0);
  for(let i=0;i<365;i++){
    const k=cur.toISOString().slice(0,10);
    const projects=loadProjects();
    const hasActivity=projects.some(p=>loadTasks(p.id).some(t=>t.doneAt&&t.doneAt.startsWith(k)));
    if(hasActivity){streak++;cur.setDate(cur.getDate()-1);}
    else if(k===todayKey()){cur.setDate(cur.getDate()-1);}
    else break;
  }
  return streak;
};

/* ══════════════════════════════════════════
   ICONS
══════════════════════════════════════════ */
const Ic=({d,s=18,c="currentColor",sw=1.8,fill="none"})=>(
  <svg width={s} height={s} viewBox="0 0 24 24" fill={fill} stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>
);
const I={
  plus:()=><Ic d="M12 5v14M5 12h14"/>,
  play:()=><Ic d="M5 3l14 9-14 9V3z"/>,
  pause:()=><Ic d="M6 4h4v16H6zM14 4h4v16h-4z"/>,
  reset:()=><Ic d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>,
  trash:()=><Ic d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>,
  edit:()=><Ic d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>,
  check:()=><Ic d="M20 6L9 17l-5-5" sw={2.5}/>,
  export:()=><Ic d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
  back:()=><Ic d="M19 12H5M12 19l-7-7 7-7"/>,
  archive:()=><Ic d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>,
  chart:()=><Ic d="M18 20V10M12 20V4M6 20v-6"/>,
  bell:()=><Ic d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/>,
  folder:()=><Ic d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>,
  more:()=><Ic d="M12 5h.01M12 12h.01M12 19h.01" sw={3}/>,
};

/* ══════════════════════════════════════════
   MAIN APP
══════════════════════════════════════════ */
function App(){
  const[projects,setProjects]=useState(loadProjects);
  const[screen,setScreen]=useState("home"); // home | project | stats | history
  const[activePid,setActivePid]=useState(null);
  const[modal,setModal]=useState(null); // null | "new-project" | "edit-project" | "new-task" | "edit-task:{id}"
  const[mood,setMood]=useState(()=>loadDay(todayKey()).mood);
  const[streak,setStreak]=useState(getStreak);
  const[filter,setFilter]=useState("all"); // all | active | done

  // Per-project tasks state
  const[tasks,setTasks]=useState([]);
  const itvRef=useRef(null);

  // Load tasks when project changes
  useEffect(()=>{
    if(activePid)setTasks(loadTasks(activePid));
  },[activePid]);

  // Tick timer
  useEffect(()=>{
    clearInterval(itvRef.current);
    if(!activePid)return;
    itvRef.current=setInterval(()=>{
      setTasks(p=>{
        const u=p.map(t=>t.running?{...t,elapsed:t.elapsed+1000}:t);
        saveTasks(activePid,u);
        return u;
      });
    },1000);
    return()=>clearInterval(itvRef.current);
  },[activePid]);

  // Save tasks
  useEffect(()=>{
    if(activePid)saveTasks(activePid,tasks);
  },[tasks]);

  // Save mood
  useEffect(()=>{
    const d=loadDay(todayKey());
    saveDay(todayKey(),{...d,mood});
  },[mood]);

  // Save projects
  useEffect(()=>saveProjects(projects),[projects]);

  /* Project ops */
  const addProject=data=>{
    const p={id:uid(),createdAt:new Date().toISOString(),archived:false,...data};
    setProjects(prev=>[p,...prev]);
  };
  const updProject=(id,patch)=>setProjects(p=>p.map(pr=>pr.id===id?{...pr,...patch}:pr));
  const delProject=id=>{
    setProjects(p=>p.filter(pr=>pr.id!==id));
    localStorage.removeItem("tf3_tasks_"+id);
    if(activePid===id){setActivePid(null);setScreen("home");}
  };

  /* Task ops */
  const addTask=data=>setTasks(p=>[...p,{id:uid(),elapsed:0,running:false,done:false,priority:false,status:"À faire",createdAt:new Date().toISOString(),...data}]);
  const updTask=(id,patch)=>setTasks(p=>p.map(t=>t.id===id?{...t,...patch}:t));
  const delTask=id=>setTasks(p=>p.filter(t=>t.id!==id));
  const toggleTimer=id=>setTasks(p=>p.map(t=>t.id===id?{...t,running:!t.running}:{...t,running:false}));
  const toggleDone=id=>{
    setTasks(p=>p.map(t=>t.id===id?{...t,done:!t.done,running:false,doneAt:!t.done?new Date().toISOString():null,status:!t.done?"Terminée":"À faire"}:t));
    setTimeout(()=>setStreak(getStreak()),100);
  };

  const openProject=pid=>{
    setActivePid(pid);
    setTasks(loadTasks(pid));
    setScreen("project");
    setFilter("all");
  };

  const activeProject=projects.find(p=>p.id===activePid);
  const visibleProjects=projects.filter(p=>!p.archived);
  const archivedProjects=projects.filter(p=>p.archived);

  /* All-project stats */
  const globalStats=useMemo(()=>{
    const allTasks=projects.flatMap(p=>loadTasks(p.id));
    return{
      total:allTasks.length,
      done:allTasks.filter(t=>t.done).length,
      time:allTasks.reduce((s,t)=>s+t.elapsed,0),
      projects:projects.length,
    };
  },[projects,screen]);

  /* ── RENDER ── */
  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#0a0a14",overflow:"hidden"}}>

      {/* ══ HOME ══ */}
      {screen==="home"&&(
        <HomeScreen
          projects={visibleProjects} archivedProjects={archivedProjects}
          globalStats={globalStats} streak={streak} mood={mood} setMood={setMood}
          onOpen={openProject}
          onNew={()=>setModal("new-project")}
          onEdit={p=>{setActivePid(p.id);setModal("edit-project");}}
          onArchive={p=>updProject(p.id,{archived:true})}
          onDelete={delProject}
          onStats={()=>setScreen("stats")}
          onHistory={()=>setScreen("history")}
        />
      )}

      {/* ══ PROJECT DETAIL ══ */}
      {screen==="project"&&activeProject&&(
        <ProjectScreen
          project={activeProject} tasks={tasks} filter={filter} setFilter={setFilter}
          onBack={()=>{setScreen("home");setActivePid(null);}}
          onEditProject={()=>setModal("edit-project")}
          onNewTask={()=>setModal("new-task")}
          onEditTask={id=>setModal("edit-task:"+id)}
          onToggleDone={toggleDone}
          onToggleTimer={toggleTimer}
          onReset={id=>updTask(id,{elapsed:0,running:false})}
          onDelete={delTask}
          onUpdTask={updTask}
        />
      )}

      {/* ══ STATS ══ */}
      {screen==="stats"&&(
        <StatsScreen projects={projects} globalStats={globalStats} streak={streak} onBack={()=>setScreen("home")}/>
      )}

      {/* ══ HISTORY ══ */}
      {screen==="history"&&(
        <HistoryScreen projects={projects} streak={streak} mood={mood} onBack={()=>setScreen("home")}/>
      )}

      {/* ══ MODALS ══ */}
      {modal==="new-project"&&(
        <ProjectModal onSave={d=>{addProject(d);setModal(null);}} onClose={()=>setModal(null)}/>
      )}
      {modal==="edit-project"&&activeProject&&(
        <ProjectModal project={activeProject} onSave={d=>{updProject(activeProject.id,d);setModal(null);}} onClose={()=>setModal(null)}/>
      )}
      {modal==="new-task"&&(
        <TaskModal project={activeProject} onSave={d=>{addTask(d);setModal(null);}} onClose={()=>setModal(null)}/>
      )}
      {modal&&modal.startsWith("edit-task:")&&(()=>{
        const tid=modal.slice(10);
        const t=tasks.find(x=>x.id===tid);
        return t?<TaskModal project={activeProject} task={t} onSave={d=>{updTask(tid,d);setModal(null);}} onClose={()=>setModal(null)}/>:null;
      })()}
    </div>
  );
}

/* ══════════════════════════════════════════
   HOME SCREEN
══════════════════════════════════════════ */
function HomeScreen({projects,archivedProjects,globalStats,streak,mood,setMood,onOpen,onNew,onEdit,onArchive,onDelete,onStats,onHistory}){
  const[showArchived,setShowArchived]=useState(false);
  const[showDeleteId,setShowDeleteId]=useState(null);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      {/* Header */}
      <div style={{background:"linear-gradient(180deg,#12122a 0%,#0a0a14 100%)",padding:"44px 20px 0",flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
          <div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.3)",letterSpacing:2,marginBottom:4}}>
              {new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
            </div>
            <div style={{fontSize:26,fontWeight:800,color:"#fff",letterSpacing:-.5}}>Mes Projets</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.35)",marginTop:3}}>
              {globalStats.projects} projet{globalStats.projects!==1?"s":""} · {globalStats.done}/{globalStats.total} tâches
            </div>
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
            <div className="glass" style={{display:"flex",alignItems:"center",gap:6,padding:"5px 11px",borderRadius:20}}>
              <span style={{fontSize:13}}>🔥</span>
              <span style={{fontSize:13,fontWeight:700,color:"#fb923c"}}>{streak}</span>
              <span style={{fontSize:10,color:"rgba(255,255,255,.3)"}}>jours</span>
            </div>
            <div style={{display:"flex",gap:4}}>
              {MOODS.map(m=>(
                <button key={m.id} onClick={()=>setMood(m.id)}
                  style={{width:28,height:28,borderRadius:9,background:mood===m.id?m.c+"33":"rgba(255,255,255,.05)",
                    border:mood===m.id?`1px solid ${m.c}55`:"1px solid transparent",fontSize:12,transition:"all .2s",
                    transform:mood===m.id?"scale(1.15)":"scale(1)"}}>
                  {m.e}
                </button>
              ))}
            </div>
          </div>
        </div>

        {/* Quick stats bar */}
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[["📊","Stats",onStats],["📅","Historique",onHistory]].map(([ico,l,fn])=>(
            <button key={l} onClick={fn} className="glass"
              style={{flex:1,padding:"8px",borderRadius:10,fontSize:11,color:"rgba(255,255,255,.5)",fontWeight:600,letterSpacing:.5,display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
              <span>{ico}</span>{l}
            </button>
          ))}
          <button onClick={onNew}
            style={{flex:2,padding:"8px 14px",borderRadius:10,background:"linear-gradient(135deg,#63dcb4,#a78bfa)",
              color:"#0a0a14",fontSize:12,fontWeight:800,letterSpacing:.5,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
            <I.plus/> NOUVEAU PROJET
          </button>
        </div>

        {/* Progress global */}
        <div style={{height:2,background:"rgba(255,255,255,.05)",borderRadius:1,marginBottom:-1,overflow:"hidden"}}>
          <div style={{height:"100%",width:(globalStats.total?globalStats.done/globalStats.total*100:0)+"%",
            background:"linear-gradient(90deg,#63dcb4,#a78bfa)",borderRadius:1,transition:"width .8s ease"}}/>
        </div>
      </div>

      {/* Project list */}
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 80px"}}>
        {projects.length===0&&(
          <div style={{textAlign:"center",padding:"60px 20px",color:"rgba(255,255,255,.2)"}}>
            <div style={{fontSize:56,marginBottom:16}}>🚀</div>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Aucun projet</div>
            <div style={{fontSize:13}}>Créez votre premier projet</div>
          </div>
        )}
        {projects.map((p,i)=>(
          <ProjectCard key={p.id} project={p} delay={i*40}
            onOpen={()=>onOpen(p.id)}
            onEdit={()=>onEdit(p)}
            onArchive={()=>onArchive(p)}
            onDelete={()=>setShowDeleteId(p.id)}
            confirmDelete={showDeleteId===p.id}
            onConfirmDelete={()=>{onDelete(p.id);setShowDeleteId(null);}}
            onCancelDelete={()=>setShowDeleteId(null)}
          />
        ))}

        {/* Archived */}
        {archivedProjects.length>0&&(
          <button onClick={()=>setShowArchived(!showArchived)}
            className="glass" style={{width:"100%",padding:"10px 14px",borderRadius:12,marginTop:8,
              fontSize:12,color:"rgba(255,255,255,.3)",fontWeight:600,display:"flex",alignItems:"center",gap:8}}>
            <I.archive/>
            {showArchived?"Masquer":"Voir"} les archivés ({archivedProjects.length})
          </button>
        )}
        {showArchived&&archivedProjects.map((p,i)=>(
          <ProjectCard key={p.id} project={p} delay={i*40} archived
            onOpen={()=>onOpen(p.id)}
            onEdit={()=>onEdit(p)}
            onArchive={()=>onEdit({...p,archived:false})}
            onDelete={()=>setShowDeleteId(p.id)}
            confirmDelete={showDeleteId===p.id}
            onConfirmDelete={()=>{onDelete(p.id);setShowDeleteId(null);}}
            onCancelDelete={()=>setShowDeleteId(null)}
          />
        ))}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   PROJECT CARD
══════════════════════════════════════════ */
function ProjectCard({project:p,delay,archived,onOpen,onEdit,onArchive,onDelete,confirmDelete,onConfirmDelete,onCancelDelete}){
  const tasks=loadTasks(p.id);
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const totalTime=tasks.reduce((s,t)=>s+t.elapsed,0);
  const pct=total?Math.round(done/total*100):0;
  const running=tasks.some(t=>t.running);
  const [menuOpen,setMenuOpen]=useState(false);

  return(
    <div className="su glass" style={{borderRadius:18,marginBottom:10,animationDelay:delay+"ms",
      border:`1px solid ${p.color}22`,overflow:"hidden",opacity:archived?.6:1}}>

      {confirmDelete?(
        <div style={{padding:16,textAlign:"center"}}>
          <div style={{fontSize:14,fontWeight:600,color:"#f87171",marginBottom:12}}>Supprimer "{p.name}" ?</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginBottom:14}}>Toutes les tâches seront perdues.</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={onCancelDelete} style={{flex:1,padding:10,borderRadius:10,background:"rgba(255,255,255,.07)",color:"rgba(255,255,255,.6)",fontSize:13,fontWeight:600}}>Annuler</button>
            <button onClick={onConfirmDelete} style={{flex:1,padding:10,borderRadius:10,background:"rgba(248,113,113,.2)",color:"#f87171",fontSize:13,fontWeight:700}}>Supprimer</button>
          </div>
        </div>
      ):(
        <>
          {/* Top stripe */}
          <div style={{height:3,background:`linear-gradient(90deg,${p.color},${p.color}44)`,width:pct+"%",transition:"width .6s ease"}}/>

          <div style={{padding:"14px 14px 12px"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:12}}>
              {/* Icon */}
              <div onClick={onOpen} style={{width:46,height:46,borderRadius:14,background:p.color+"22",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0,cursor:"pointer",
                border:`1px solid ${p.color}33`}}>
                {p.icon}
              </div>

              {/* Info */}
              <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={onOpen}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                  <div style={{fontSize:15,fontWeight:700,color:"#e2e2f0",lineHeight:1}}>{p.name}</div>
                  {running&&<span className="rdot" style={{width:6,height:6,background:p.color}}/>}
                  {archived&&<span style={{fontSize:9,background:"rgba(255,255,255,.08)",padding:"2px 6px",borderRadius:6,color:"rgba(255,255,255,.3)",fontWeight:600}}>ARCHIVÉ</span>}
                </div>
                {p.desc&&<div style={{fontSize:11,color:"rgba(255,255,255,.3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4}}>{p.desc}</div>}
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:11,color:p.color,fontWeight:600}}>{done}/{total} tâches</span>
                  {totalTime>0&&<span style={{fontSize:10,color:"rgba(255,255,255,.25)",fontFamily:"JetBrains Mono,monospace"}}>{fmtMin(totalTime)}</span>}
                  <span style={{fontSize:10,fontWeight:700,color:pct===100?"#63dcb4":"rgba(255,255,255,.25)"}}>{pct}%</span>
                </div>
              </div>

              {/* Menu */}
              <div style={{position:"relative"}}>
                <button onClick={()=>setMenuOpen(!menuOpen)}
                  style={{width:30,height:30,display:"flex",alignItems:"center",justifyContent:"center",
                    background:menuOpen?"rgba(255,255,255,.1)":"rgba(255,255,255,.04)",borderRadius:8,color:"rgba(255,255,255,.4)"}}>
                  <I.more/>
                </button>
                {menuOpen&&(
                  <div className="pop" onClick={()=>setMenuOpen(false)}
                    style={{position:"absolute",right:0,top:34,background:"#1e1e38",borderRadius:12,
                      border:"1px solid rgba(255,255,255,.12)",zIndex:10,minWidth:150,overflow:"hidden"}}>
                    {[
                      [<I.edit/>,"Modifier",onEdit,"rgba(255,255,255,.6)"],
                      [<I.archive/>,(archived?"Désarchiver":"Archiver"),onArchive,"rgba(255,255,255,.4)"],
                      [<I.trash/>,"Supprimer",onDelete,"#f87171"],
                    ].map(([ico,l,fn,c])=>(
                      <button key={l} onClick={fn}
                        style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 14px",
                          background:"transparent",color:c,fontSize:13,fontWeight:600,borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                        {ico}{l}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   PROJECT SCREEN
══════════════════════════════════════════ */
function ProjectScreen({project:p,tasks,filter,setFilter,onBack,onEditProject,onNewTask,onEditTask,onToggleDone,onToggleTimer,onReset,onDelete,onUpdTask}){
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;
  const totalTime=tasks.reduce((s,t)=>s+t.elapsed,0);
  const running=tasks.find(t=>t.running);

  const filtered=tasks.filter(t=>{
    if(filter==="active")return !t.done;
    if(filter==="done")return t.done;
    if(filter==="priority")return t.priority&&!t.done;
    return true;
  }).sort((a,b)=>(b.priority?1:0)-(a.priority?1:0)||(a.done?1:0)-(b.done?1:0));

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>

      {/* Header */}
      <div style={{background:`linear-gradient(180deg,#12122a 0%,#0a0a14 100%)`,padding:"44px 16px 0",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
          <button onClick={onBack} style={{width:36,height:36,display:"flex",alignItems:"center",justifyContent:"center",
            background:"rgba(255,255,255,.06)",borderRadius:10,color:"rgba(255,255,255,.6)"}}>
            <I.back/>
          </button>
          <div style={{width:42,height:42,borderRadius:13,background:p.color+"22",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,border:`1px solid ${p.color}33`}}>
            {p.icon}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:18,fontWeight:800,color:"#fff",letterSpacing:-.3,lineHeight:1}}>{p.name}</div>
            {p.desc&&<div style={{fontSize:11,color:"rgba(255,255,255,.3)",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.desc}</div>}
          </div>
          <button onClick={onEditProject} style={{width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",
            background:"rgba(255,255,255,.05)",borderRadius:9,color:"rgba(255,255,255,.4)"}}>
            <I.edit/>
          </button>
        </div>

        {/* Stats row */}
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          {[
            [done+"/"+total,"tâches",p.color],
            [pct+"%","complété",pct===100?"#63dcb4":"rgba(255,255,255,.4)"],
            [fmtMin(totalTime),"temps","rgba(255,255,255,.4)"],
            [tasks.filter(t=>t.priority&&!t.done).length+"","priorité","#fbbf24"],
          ].map(([v,l,c])=>(
            <div key={l} className="glass" style={{flex:1,padding:"8px 6px",borderRadius:10,textAlign:"center"}}>
              <div style={{fontSize:14,fontWeight:800,color:c,fontFamily:"JetBrains Mono,monospace"}}>{v}</div>
              <div style={{fontSize:9,color:"rgba(255,255,255,.25)",fontWeight:600,letterSpacing:.3,marginTop:2}}>{l.toUpperCase()}</div>
            </div>
          ))}
        </div>

        {/* Progress */}
        <div style={{height:3,background:"rgba(255,255,255,.05)",borderRadius:2,marginBottom:10,overflow:"hidden"}}>
          <div style={{height:"100%",width:pct+"%",background:`linear-gradient(90deg,${p.color},${p.color}99)`,
            borderRadius:2,transition:"width .6s ease"}}/>
        </div>

        {/* Filter + Add */}
        <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:-1}}>
          <div style={{display:"flex",gap:4,flex:1,overflowX:"auto"}}>
            {[["all","Tout"],["active","Actives"],["priority","⭐"],["done","Faites"]].map(([v,l])=>(
              <button key={v} onClick={()=>setFilter(v)}
                style={{padding:"6px 10px",borderRadius:"8px 8px 0 0",fontSize:11,fontWeight:600,letterSpacing:.3,whiteSpace:"nowrap",
                  background:filter===v?`${p.color}18`:"transparent",
                  color:filter===v?p.color:"rgba(255,255,255,.3)",
                  borderBottom:filter===v?`2px solid ${p.color}`:"2px solid transparent",transition:"all .2s"}}>
                {l}
              </button>
            ))}
          </div>
          <button onClick={onNewTask}
            style={{display:"flex",alignItems:"center",gap:5,padding:"6px 12px",
              background:`linear-gradient(135deg,${p.color},${p.color}99)`,
              color:"#0a0a14",borderRadius:20,fontSize:11,fontWeight:800,letterSpacing:.5,flexShrink:0,marginBottom:1}}>
            <I.plus/> TÂCHE
          </button>
        </div>
      </div>

      {/* Task list */}
      <div style={{flex:1,overflowY:"auto",padding:"10px 12px 80px",background:"#0a0a14"}}>
        {filtered.length===0&&(
          <div style={{textAlign:"center",padding:"50px 20px",color:"rgba(255,255,255,.2)"}}>
            <div style={{fontSize:48,marginBottom:12}}>{filter==="done"?"🎉":filter==="priority"?"⭐":"📋"}</div>
            <div style={{fontSize:14,fontWeight:600}}>
              {filter==="done"?"Aucune tâche terminée":filter==="priority"?"Aucune tâche prioritaire":"Aucune tâche"}
            </div>
            {filter==="all"&&<div style={{fontSize:12,marginTop:6}}>Ajoutez votre première tâche</div>}
          </div>
        )}
        {filtered.map((t,i)=>(
          <TaskCard key={t.id} task={t} project={p} delay={i*35}
            onToggleDone={()=>onToggleDone(t.id)}
            onToggleTimer={()=>onToggleTimer(t.id)}
            onReset={()=>onReset(t.id)}
            onEdit={()=>onEditTask(t.id)}
            onDelete={()=>onDelete(t.id)}
            onPriority={()=>onUpdTask(t.id,{priority:!t.priority})}
            onStatus={s=>onUpdTask(t.id,{status:s})}
          />
        ))}
      </div>

      {/* Running banner */}
      {running&&(
        <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"10px 16px",
          background:`linear-gradient(135deg,${p.color}22,${p.color}11)`,
          borderTop:`1px solid ${p.color}33`,display:"flex",alignItems:"center",gap:10}}>
          <span className="rdot" style={{width:8,height:8,background:p.color}}/>
          <span style={{flex:1,fontSize:13,fontWeight:600,color:p.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{running.title}</span>
          <span style={{fontSize:14,fontWeight:700,fontFamily:"JetBrains Mono,monospace",color:p.color}}>{fmtTime(running.elapsed)}</span>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════
   TASK CARD
══════════════════════════════════════════ */
function TaskCard({task:t,project:p,delay,onToggleDone,onToggleTimer,onReset,onEdit,onDelete,onPriority,onStatus}){
  const[showStatus,setShowStatus]=useState(false);
  const statusColors={"À faire":"rgba(255,255,255,.2)","En cours":"#fbbf24","En révision":"#60a5fa","Terminée":"#63dcb4"};

  return(
    <div className="su glass" style={{borderRadius:16,padding:12,marginBottom:8,animationDelay:delay+"ms",
      borderLeft:`3px solid ${t.done?"rgba(255,255,255,.1)":p.color}`,
      opacity:t.done?.45:1,transition:"opacity .3s"}}>

      <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
        {/* Check */}
        <button onClick={onToggleDone}
          style={{width:22,height:22,borderRadius:7,border:`1.5px solid ${t.done?"rgba(255,255,255,.2)":p.color}`,
            background:t.done?p.color+"33":"transparent",display:"flex",alignItems:"center",
            justifyContent:"center",flexShrink:0,marginTop:2,transition:"all .25s",color:p.color}}>
          {t.done&&<I.check/>}
        </button>

        {/* Content */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginBottom:3}}>
            <button onClick={()=>setShowStatus(!showStatus)}
              style={{fontSize:9,padding:"2px 7px",borderRadius:6,fontWeight:700,letterSpacing:.4,
                background:statusColors[t.status||"À faire"]+"22",
                color:statusColors[t.status||"À faire"],border:`1px solid ${statusColors[t.status||"À faire"]}44`}}>
              {t.status||"À FAIRE"}
            </button>
            {t.priority&&<span style={{fontSize:10,color:"#fbbf24"}}>⭐</span>}
          </div>
          {showStatus&&(
            <div className="pop" style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>
              {CATS.map(s=>(
                <button key={s} onClick={()=>{onStatus(s);setShowStatus(false);}}
                  style={{fontSize:10,padding:"3px 8px",borderRadius:6,fontWeight:600,
                    background:t.status===s?statusColors[s]+"33":"rgba(255,255,255,.05)",
                    color:t.status===s?statusColors[s]:"rgba(255,255,255,.4)",border:"1px solid rgba(255,255,255,.08)"}}>
                  {s}
                </button>
              ))}
            </div>
          )}
          <div style={{fontSize:14,fontWeight:600,color:t.done?"rgba(255,255,255,.3)":"#e2e2f0",
            textDecoration:t.done?"line-through":"none",lineHeight:1.3,marginBottom:t.note?3:0}}>
            {t.title}
          </div>
          {t.note&&<div style={{fontSize:11,color:"rgba(255,255,255,.28)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.note}</div>}
          {t.reminder&&(
            <div style={{fontSize:10,color:"#fbbf24",marginTop:3,display:"flex",alignItems:"center",gap:3}}>
              <I.bell/>{new Date(t.reminder).toLocaleString("fr-FR",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"})}
            </div>
          )}
        </div>

        {/* Actions */}
        <div style={{display:"flex",gap:3,flexShrink:0}}>
          <button onClick={onPriority}
            style={{width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",
              background:t.priority?"rgba(251,191,36,.15)":"rgba(255,255,255,.04)",borderRadius:7,
              fontSize:12,border:t.priority?"1px solid rgba(251,191,36,.3)":"1px solid transparent"}}>⭐</button>
          <button onClick={onEdit}
            style={{width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.04)",borderRadius:7,color:"rgba(255,255,255,.35)"}}>
            <I.edit/>
          </button>
          <button onClick={onDelete}
            style={{width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(248,113,113,.08)",borderRadius:7,color:"#f87171"}}>
            <I.trash/>
          </button>
        </div>
      </div>

      {/* Timer */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,paddingTop:8,borderTop:"1px solid rgba(255,255,255,.05)"}}>
        <div style={{fontFamily:"JetBrains Mono,monospace",fontSize:19,fontWeight:500,letterSpacing:2,
          color:t.running?p.color:"rgba(255,255,255,.35)"}}>
          {fmtTime(t.elapsed)}
        </div>
        {t.running&&<span className="rdot" style={{width:6,height:6,background:p.color}}/>}
        <div style={{marginLeft:"auto",display:"flex",gap:5,alignItems:"center"}}>
          {t.elapsed>0&&<button onClick={onReset}
            style={{width:26,height:26,display:"flex",alignItems:"center",justifyContent:"center",
              background:"rgba(255,255,255,.04)",borderRadius:7,color:"rgba(255,255,255,.25)"}}>
            <I.reset/>
          </button>}
          <button onClick={onToggleTimer} disabled={t.done}
            className={t.running?"ring":""}
            style={{display:"flex",alignItems:"center",gap:5,padding:"5px 12px",borderRadius:18,
              background:t.done?"rgba(255,255,255,.04)":t.running?p.color+"28":"rgba(255,255,255,.07)",
              color:t.done?"rgba(255,255,255,.15)":t.running?p.color:"rgba(255,255,255,.5)",
              border:t.running?`1px solid ${p.color}44`:"1px solid rgba(255,255,255,.08)",
              fontSize:11,fontWeight:700,letterSpacing:.5,transition:"all .2s",
              "--rc":p.color+"44"}}>
            {t.running?<I.pause/>:<I.play/>}
            {t.running?"PAUSE":"START"}
          </button>
        </div>
      </div>
    </div>
  );
}

      <div onClick={e=>e.stopPropagation()} className="pop"

/* ══════════════════════════════════════════
   STATS SCREEN
══════════════════════════════════════════ */
function StatsScreen({projects,globalStats,streak,onBack}){
  const allProjects=projects.filter(p=>!p.archived);
  const projectStats=allProjects.map(p=>{
    const tasks=loadTasks(p.id);
    return{...p,tasks,done:tasks.filter(t=>t.done).length,total:tasks.length,time:tasks.reduce((s,t)=>s+t.elapsed,0)};
  }).sort((a,b)=>b.time-a.time);
  const maxTime=Math.max(...projectStats.map(p=>p.time),1);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      <div style={{background:"linear-gradient(180deg,#12122a 0%,#0a0a14 100%)",padding:"44px 16px 16px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:4}}>
          <button onClick={onBack} style={{width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.06)",borderRadius:9,color:"rgba(255,255,255,.6)"}}>
            <I.back/>
          </button>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>Statistiques</div>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 80px",background:"#0a0a14"}}>

        {/* Global */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
          {[["🔥",streak+" jours","Série","#fb923c"],["📁",globalStats.projects,"Projets","#60a5fa"],
            ["✅",globalStats.done,"Terminées","#63dcb4"],["⏱",fmtMin(globalStats.time),"Temps total","#a78bfa"]
          ].map(([ico,v,l,c])=>(
            <div key={l} className="glass" style={{borderRadius:16,padding:14,border:`1px solid ${c}22`}}>
              <div style={{fontSize:18,marginBottom:6}}>{ico}</div>
              <div style={{fontSize:22,fontWeight:800,color:c,fontFamily:"JetBrains Mono,monospace",lineHeight:1}}>{v}</div>
              <div style={{fontSize:10,color:"rgba(255,255,255,.3)",fontWeight:600,letterSpacing:.5,marginTop:4}}>{l.toUpperCase()}</div>
            </div>
          ))}
        </div>

        {/* Per-project */}
        <div style={{fontSize:11,color:"rgba(255,255,255,.3)",fontWeight:600,letterSpacing:1,marginBottom:10}}>PAR PROJET</div>
        {projectStats.map(p=>{
          const pct=p.total?Math.round(p.done/p.total*100):0;
          return(
            <div key={p.id} className="glass" style={{borderRadius:14,padding:"12px 14px",marginBottom:8,border:`1px solid ${p.color}18`}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                <span style={{fontSize:18}}>{p.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700,color:"#e2e2f0"}}>{p.name}</div>
                  <div style={{fontSize:10,color:"rgba(255,255,255,.3)"}}>{p.done}/{p.total} tâches · {fmtMin(p.time)}</div>
                </div>
                <div style={{fontSize:14,fontWeight:800,color:pct===100?"#63dcb4":p.color,fontFamily:"JetBrains Mono,monospace"}}>{pct}%</div>
              </div>
              <div style={{height:4,background:"rgba(255,255,255,.06)",borderRadius:2}}>
                <div style={{height:"100%",width:Math.round(p.time/maxTime*100)+"%",background:`linear-gradient(90deg,${p.color},${p.color}66)`,borderRadius:2,transition:"width .6s ease"}}/>
              </div>
            </div>
          );
        })}
        {projectStats.length===0&&<div style={{fontSize:13,color:"rgba(255,255,255,.2)",textAlign:"center",padding:"30px 0"}}>Aucun projet actif</div>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════
   HISTORY SCREEN
══════════════════════════════════════════ */
function HistoryScreen({projects,streak,mood,onBack}){
  const exportCSV=()=>{
    const rows=[["Projet","Tâche","Statut","Temps (min)","Terminée","Date"]];
    projects.forEach(p=>{
      loadTasks(p.id).forEach(t=>{
        rows.push([p.name,t.title,t.status||"",Math.round(t.elapsed/60000),t.done?"Oui":"Non",t.doneAt?t.doneAt.slice(0,10):"—"]);
      });
    });
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(rows.map(r=>r.join(",")).join("\n"));
    a.download="taskflow_export_"+todayKey()+".csv";a.click();
  };

  // Build 30-day activity grid
  const activityGrid=Array.from({length:30},(_,i)=>{
    const d=new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const done=projects.reduce((s,p)=>s+loadTasks(p.id).filter(t=>t.doneAt&&t.doneAt.startsWith(d)).length,0);
    return{d,done};
  }).reverse();
  const maxDone=Math.max(...activityGrid.map(a=>a.done),1);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
      <div style={{background:"linear-gradient(180deg,#12122a 0%,#0a0a14 100%)",padding:"44px 16px 16px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button onClick={onBack} style={{width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,.06)",borderRadius:9,color:"rgba(255,255,255,.6)"}}>
            <I.back/>
          </button>
          <div style={{fontSize:20,fontWeight:800,color:"#fff"}}>Historique</div>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"14px 14px 80px",background:"#0a0a14"}}>

        {/* Streak */}
        <div className="glass" style={{borderRadius:16,padding:16,marginBottom:16,
          background:"linear-gradient(135deg,rgba(251,146,60,.08),rgba(167,139,250,.08))",
          border:"1px solid rgba(251,146,60,.2)",display:"flex",alignItems:"center",gap:14}}>
          <div style={{fontSize:36}}>🔥</div>
          <div>
            <div style={{fontSize:28,fontWeight:800,color:"#fb923c",fontFamily:"JetBrains Mono,monospace",lineHeight:1}}>{streak}</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginTop:2}}>jours consécutifs avec tâches terminées</div>
          </div>
        </div>

        {/* 30-day heatmap */}
        <div style={{fontSize:11,color:"rgba(255,255,255,.3)",fontWeight:600,letterSpacing:1,marginBottom:10}}>ACTIVITÉ — 30 JOURS</div>
        <div className="glass" style={{borderRadius:16,padding:14,marginBottom:16}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
            {activityGrid.map(({d,done})=>{
              const intensity=done/maxDone;
              const isToday=d===todayKey();
              return(
                <div key={d} style={{width:26,height:26,borderRadius:7,
                  background:done>0?`rgba(99,220,180,${0.12+intensity*0.75})`:"rgba(255,255,255,.04)",
                  border:isToday?"1px solid #63dcb4":"1px solid transparent",
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,
                  color:"rgba(255,255,255,.5)",fontWeight:700}}>
                  {done>0?done:""}
                </div>
              );
            })}
          </div>
          <div style={{fontSize:10,color:"rgba(255,255,255,.18)",marginTop:8}}>Chiffre = tâches terminées ce jour · vert plus foncé = plus actif</div>
        </div>

        {/* Recent done tasks */}
        <div style={{fontSize:11,color:"rgba(255,255,255,.3)",fontWeight:600,letterSpacing:1,marginBottom:10}}>DERNIÈRES TÂCHES TERMINÉES</div>
        {(()=>{
          const done=projects.flatMap(p=>loadTasks(p.id).filter(t=>t.done&&t.doneAt).map(t=>({...t,projectName:p.name,projectIcon:p.icon,projectColor:p.color})))
            .sort((a,b)=>new Date(b.doneAt)-new Date(a.doneAt)).slice(0,15);
          return done.length===0?(
            <div style={{fontSize:13,color:"rgba(255,255,255,.2)",textAlign:"center",padding:"30px 0"}}>Aucune tâche terminée pour l'instant</div>
          ):done.map((t,i)=>(
            <div key={t.id+i} className="glass" style={{borderRadius:12,padding:"10px 12px",marginBottom:6,
              display:"flex",alignItems:"center",gap:10,borderLeft:`3px solid ${t.projectColor}`}}>
              <span style={{fontSize:16}}>{t.projectIcon}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:"rgba(255,255,255,.6)",textDecoration:"line-through",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.title}</div>
                <div style={{fontSize:10,color:"rgba(255,255,255,.25)"}}>{t.projectName} · {fmtMin(t.elapsed)}</div>
              </div>
              <div style={{fontSize:10,color:"rgba(255,255,255,.2)",fontFamily:"JetBrains Mono,monospace",flexShrink:0}}>
                {t.doneAt?new Date(t.doneAt).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}):""}
              </div>
              <span style={{fontSize:12,color:"#63dcb4"}}>✓</span>
            </div>
          ));
        })()}

        {/* Export */}
        <button onClick={exportCSV}
          style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,width:"100%",
            padding:15,borderRadius:14,background:"linear-gradient(135deg,#63dcb4,#a78bfa)",
            color:"#0a0a14",fontSize:13,fontWeight:800,letterSpacing:.5,marginTop:16}}>
          <I.export/> EXPORTER TOUT EN CSV
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
